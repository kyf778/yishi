org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# --- 网络代理 ---
# Gradle/Java 不使用 Windows 系统代理，直连 GitHub CDN 在国内被限速到 ~8KB/s，
# 导致 Android Studio 同步时下载 Gradle 源码包卡死。
# 这里显式指向 Clash（本机 7897 端口），并把国内镜像排除在代理之外。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.tencent.com|*.google.cn|*.aliyuncs.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.tencent.com|*.google.cn|*.aliyuncs.com
